# Experiment configuration file.

seml:
  conda_environment: 'env-quant-rel-310'
  executable: 'run_reliability_eval.py'
  name: 'test-10-14'
  output_dir: '/nfs/homedirs/daro/slurm_output/'
  project_root_dir: '/nfs/homedirs/daro/git/quantization-reliability/'

slurm:
  experiments_per_job: 1
  sbatch_options:
    gres: 'gpu:1'        # num GPUs
    mem: '128G'          # memory
    cpus-per-task: 2     # num cores
    time: '1-00:00'      # max time, D-HH:MM
    partition: 'gpu_a100' # partition

###### BEGIN PARAMETER CONFIGURATION ######
fixed:
  exp_id: "test-10-14"
  save_excel: False
  num_excel_rows: 100
  device: 'cuda'
  seed: 42
  n_repeats: 1
  n_beams: 5
  max_entries: None
  batch_size: 512

grid:
  model_name:
    type: choice
    options:
      - 'Llama-3-8B'
      # - 'Bloomz'
      # - 'GPT2-Large'
      # - 'TinyLlama'
      # - 'TinyLlama-Chat'
      # - 'Llama-3-8B-AWQ-4bit-local'
      # - 'Llama-3-8B-BNB-4bit-local'
      # - 'Llama-3-8B-HQQ-mixed-local'
      # - 'Bloomz'
      # - 'GPT2-Large'
      # - 'TinyLlama'
      # - 'TinyLlama-Chat'
      # - 'Llama-3-8B-BNB-4bit-local'
