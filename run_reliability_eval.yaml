# Experiment configuration file.

seml:
  conda_environment: 'env-quant-rel-310'
  executable: 'run_reliability_eval.py'
  name: 'typo-test-10-01'
  output_dir: '/nfs/homedirs/daro/slurm_output/'
  project_root_dir: '/nfs/homedirs/daro/git/quantization-reliability/'

slurm:
  experiments_per_job: 1
  sbatch_options:
    gres: 'gpu:1'        # num GPUs
    mem: '24G'          # memory
    cpus-per-task: 2     # num cores
    time: '1-00:00'      # max time, D-HH:MM
    partition: 'gpu_a100' # partition

###### BEGIN PARAMETER CONFIGURATION ######
fixed:
  exp_id: "typo-test-10-01"
  save_excel: True
  num_excel_rows: 100
  device: 'cuda'
  seed: 42
  n_repeats: 10
  n_beams: 5
  max_entries: None

grid:
  model_name:
    type: choice
    options:
      - 'Llama-3-8B'
      # - 'Bloomz'
      # - 'GPT2-Large'
      # - 'TinyLlama'
      # - 'TinyLlama-Chat'
      # - 'Llama-3-8B-AWQ-8bit'
      # - 'Llama-3-8B-BNB-4bit'
      # - 'Llama-3-8B-BNB-8bit'
      # - 'Llama-3-8B-HQQ-8-uniform'
      # - 'Llama-3-8B-HQQ-mixed'
      # - 'Llama-3-8B-HQQ-LORA'
      # - 'Llama-3-8B-QUANTO'
      # - 'Llama-3-8B-QUANTO-CALIB'
      # - 'Llama-3-8B-QUANTO-QAT'
      # - 'Llama-3-8B-AQLM'
      # - 'Llama-3-8B-AQLM-LORA'

